name: Temp ZIP Artifact Bridge
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: airbnb-photos-1591644672258346257
          path: airbnb_photos_1591644672258346257.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
